name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generates raycast-env.d.ts and type-checks the extension.
      - run: npm run build
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npm test
      # Offline run with a fake model: catches eval harness and sample-file breakage without API keys.
      - run: npm run bench -- --dry-run
      # Production dependencies only; dev-tool advisories are tracked by Dependabot.
      - run: npm audit --omit=dev --audit-level=high
